name: Pipeline

on:
  push:
    branches: [main]
  repository_dispatch:
    # Kept for compatibility with the existing nativesem repository dispatch.
    types: [r-c-typing-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # The nativesem image provides the type checker binary, types/, and
    # libtree-sitter.so, with CHECKER_DIR / CHECKER / TS_LIB_DIR already set.
    # The image is public.
    container:
      image: ghcr.io/programlyrique/nativesem:latest

    steps:
      - uses: actions/checkout@v6

      - name: Download source tarballs
        run: make download

      - name: Extract tarballs
        run: make extract

      - name: Run type checker
        run: make typecheck

      - name: Parse results and generate webpage
        run: make results webpage

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ github.run_number }}
          path: results/

      - name: Upload dashboard for GitHub Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: results/

  deploy-pages:
    needs: pipeline
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
