name: Pipeline

on:
  push:
    branches: [main]
  repository_dispatch:
    # typr-updated: a new TypR image (dispatched by PRL-PRG/typr).
    # r-c-typing-updated: the legacy nativesem dispatch, kept as a fallback.
    types: [typr-updated, r-c-typing-updated]
  workflow_dispatch:
    inputs:
      fuzz:
        description: "Also fuzz the inferred types (FUZZ=1): installs the packages, then calls their functions in a sandbox"
        type: boolean
        default: true
      sandbox:
        description: "Sandbox of the fuzzed calls: bwrap, or none (the runner, a throwaway VM, is then the only boundary)"
        type: choice
        options: [bwrap, none]
        default: bwrap
      image:
        description: "TypR image to run (default ghcr.io/prl-prg/typr:latest)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read     # to fetch the previous run's results as the baseline
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # The TypR image provides the checker binary, types/, the prelude,
    # libtree-sitter.so and provenance.json, with CHECKER_DIR / CHECKER /
    # TS_LIB_DIR already set, plus ctags and jsonlite for the dashboard.
    # `container:` does not lowercase the reference: keep it lowercase here.
    # Every run fuzzes, but a manual one with `fuzz` off (pushes and TypR's
    # dispatches have no inputs). Fuzzing with bwrap needs a container allowed
    # to create namespaces and mount (scripts/fuzz_sandbox.sh);
    # systempaths=unconfined lets it mount a fresh /proc.
    container:
      image: ${{ inputs.image || 'ghcr.io/prl-prg/typr:latest' }}
      options: ${{ (github.event_name != 'workflow_dispatch' || inputs.fuzz) && inputs.sandbox != 'none' && '--cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined' || '' }}
    # The image sets no locale, so R runs in the POSIX one and write.csv
    # escapes every non-ASCII character of the UTF-8 strings jsonlite reads
    # (the ∀ of polymorphic types became <U+2200> in the dashboard).
    env:
      LC_ALL: C.UTF-8
      FUZZ: ${{ (github.event_name != 'workflow_dispatch' || inputs.fuzz) && '1' || '0' }}
      FUZZ_SANDBOX: ${{ inputs.sandbox || 'bwrap' }}
      # Without a sandbox, the runner is the boundary: a VM thrown away
      # after the job, whose results are only what it uploads.
      FUZZ_UNSAFE: ${{ inputs.sandbox == 'none' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v6

      # results/ is not committed, so the previous run's artifact is the only
      # baseline there is. It feeds the Change column, the was -> now badges
      # and the error deltas. A first run, or an expired artifact, just
      # renders without them.
      - name: Find the previous successful run
        id: prev
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', branch: 'main', status: 'success', per_page: 1 });
            core.setOutput('run_id', data.workflow_runs[0]?.id ?? '');

      - name: Download the baseline
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: results-*
          merge-multiple: true
          path: results.prev

      - name: Download source tarballs
        run: make download

      - name: Extract tarballs
        run: make extract

      # Fail now rather than after the install if the container cannot host
      # the sandbox.
      - name: Check the fuzzing sandbox
        if: env.FUZZ == '1' && env.FUZZ_SANDBOX == 'bwrap'
        run: |
          bwrap --ro-bind / / --dev /dev --tmpfs /tmp --unshare-all --die-with-parent --proc /proc true \
            || bwrap --ro-bind / / --dev /dev --tmpfs /tmp --unshare-all --die-with-parent --ro-bind /proc /proc true

      # In the same container as the fuzzing: bspm puts dependencies in its
      # system library.
      - name: Install packages
        if: env.FUZZ == '1'
        run: make install

      - name: Run type checker
        run: make typecheck

      - name: Parse results and generate webpage
        run: make results webpage

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ github.run_number }}
          path: results/

      # The fuzzing's raw files (samples, harness results and logs) and what
      # installed, for debugging: the dashboard has only its verdicts.
      - name: Upload fuzzing files
        if: always() && env.FUZZ == '1'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ github.run_number }}
          path: |
            work/raw_output/strict/fuzz/
            work/library/install_status.csv
          if-no-files-found: ignore

      - name: Upload dashboard for GitHub Pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: results/

  deploy-pages:
    needs: pipeline
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
